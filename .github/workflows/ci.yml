name: CI — Tests & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Der Release-Workflow ruft die CI auf und baut nur, wenn sie grün ist.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Typecheck, Unit Tests, E2E UI Tests & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit (Laufzeit-Abhängigkeiten)
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript Strict Check
        run: npx tsc --noEmit

      - name: Run Unit & Functional Tests (Format, DB, Recurring Processor)
        env:
          DATABASE_PATH: ./data/test.db
        run: npm run test:unit

      - name: Initialize & Seed Database for E2E Tests
        env:
          DATABASE_PATH: ./data/app.db
          UPLOADS_DIR: ./data/uploads
          BETTER_AUTH_SECRET: ci-test-secret-key-at-least-32-characters-long
          AUTH_SECRET: ci-test-secret-key-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3123
          APP_URL: http://localhost:3123
          NEXT_PUBLIC_APP_URL: http://localhost:3123
        run: |
          rm -f ./data/app.db ./data/app.db-wal ./data/app.db-shm
          npm run db:migrate
          npm run db:seed

      - name: Build Production Next.js App (Standalone + Serwist PWA)
        env:
          DATABASE_PATH: ./data/app.db
          UPLOADS_DIR: ./data/uploads
          BETTER_AUTH_SECRET: ci-test-secret-key-at-least-32-characters-long
          AUTH_SECRET: ci-test-secret-key-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3123
          APP_URL: http://localhost:3123
          NEXT_PUBLIC_APP_URL: http://localhost:3123
        run: npm run build

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UI & E2E Tests
        env:
          DATABASE_PATH: ./data/app.db
          UPLOADS_DIR: ./data/uploads
          BETTER_AUTH_SECRET: ci-test-secret-key-at-least-32-characters-long
          AUTH_SECRET: ci-test-secret-key-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3123
          APP_URL: http://localhost:3123
          NEXT_PUBLIC_APP_URL: http://localhost:3123
        run: npm run test:e2e

  docker-smoke-test:
    name: Docker Build & Container Smoke Test (/api/health)
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker Image
        run: docker build -t cashflow:ci .

      - name: Smoke Test Container with Host Bind-Mount (/data) & Healthcheck (/api/health)
        run: |
          mkdir -p /tmp/cashflow-bind-data
          docker run -d --name cashflow-test -p 3000:3000 \
            -v /tmp/cashflow-bind-data:/data \
            -e AUTH_SECRET="ci-docker-secret-key-mindestens-32-zeichen" \
            -e BETTER_AUTH_SECRET="ci-docker-secret-key-mindestens-32-zeichen" \
            -e APP_URL="http://localhost:3000" \
            cashflow:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo "Container Healthcheck mit Bind-Mount erfolgreich!"
              docker exec cashflow-test ps aux
              docker stop cashflow-test
              exit 0
            fi
            sleep 1
          done
          docker logs cashflow-test
          exit 1

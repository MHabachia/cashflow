services:
  cashflow:
    image: ghcr.io/mhabachia/cashflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashflow-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/app.db
      - UPLOADS_DIR=/data/uploads
      - BETTER_AUTH_SECRET=${AUTH_SECRET:-bitte-in-env-setzen-mindestens-32-zeichen}
      - AUTH_SECRET=${AUTH_SECRET:-bitte-in-env-setzen-mindestens-32-zeichen}
      - BETTER_AUTH_URL=${APP_URL:-http://localhost:3000}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${APP_URL:-http://localhost:3000}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
